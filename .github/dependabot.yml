version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # reportlab 5.x needs Python 3.10+; the app still supports 3.9.
      - dependency-name: "reportlab"
        versions: [">=4.3"]

  # Keeps the Dockerfile's python base image current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
